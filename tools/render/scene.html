<script type="module">

{

const loader = new THREE.TextureLoader();

// ---------- pouch ----------
const PW = 1.6, PH = 2.31, D = 0.24, SEAL = 0.07;
function pouchHalf() {
  const g = new THREE.PlaneGeometry(PW, PH, 80, 110);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    const u = x / (PW / 2), v = y / (PH / 2), inner = 1 - SEAL;
    const fv = Math.abs(v) < inner ? Math.pow(1 - Math.pow(Math.abs(v) / inner, 4), 0.55) : 0;
    const fu = Math.pow(Math.max(0, 1 - u * u), 0.42);
    let z = D * fu * fv;
    if (Math.abs(v) >= inner) z = 0.006 * Math.sin(y * 260) * Math.min(1, (Math.abs(v) - inner) * 40);
    else z += 0.012 * Math.sin(u * 14 + v * 3) * Math.pow(Math.abs(v) / inner, 8);
    p.setXYZ(i, x * (1 - 0.07 * fu * fv), y * (1 - 0.02 * fu), z);
  }
  g.computeVertexNormals();

}

const pack = new THREE.Group();

  const back = new THREE.Mesh(pouchHalf(), pouchMat(backTex)); back.rotation.y = Math.PI;
  pack.add(front, back); pack.scale.setScalar(1.38);
}
const packGroup = new THREE.Group(); packGroup.add(pack); scene.add(packGroup);
const POUCH_TOP = 1.55; // local distance from pouch centre to its top seal (after the 1.38 scale)

// ---------- clothes ----------
const CLOTH = [
  { kind: 'tee', color: '#ffffff' }, { kind: 'shirt', color: '#8fd3ff' }, { kind: 'towel', color: '#ff9fb8' },
  { kind: 'tee', color: '#ffd84d' }, { kind: 'pant', color: '#3e64c8' },

function clothShape(g, kind) {
  g.beginPath();
  if (kind === 'tee' || kind === 'shirt') {
    g.moveTo(88, 20); g.quadraticCurveTo(128, 50, 168, 20); g.lineTo(236, 52); g.lineTo(212, 112); g.lineTo(186, 100);
    g.lineTo(190, 290); g.lineTo(66, 290); g.lineTo(70, 100); g.lineTo(44, 112); g.lineTo(20, 52); g.closePath();
  } else if (kind === 'pant') {
    g.moveTo(60, 14); g.lineTo(196, 14); g.lineTo(214, 292); g.lineTo(144, 292); g.lineTo(128, 110);
    g.lineTo(112, 292); g.lineTo(42, 292); g.closePath();
  } else { g.rect(22, 14, 212, 278); }
}

  const [c, g] = mkCanvas(256, 300);
  g.save(); clothShape(g, kind); g.clip();
  g.fillStyle = color; g.fillRect(0, 0, 256, 300);
  const sh = g.createLinearGradient(0, 0, 256, 300); sh.addColorStop(0, 'rgba(255,255,255,.25)'); sh.addColorStop(1, 'rgba(0,0,0,.18)');
  g.fillStyle = sh; g.fillRect(0, 0, 256, 300);
  if (kind === 'towel') { g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(0, 40, 256, 14); g.fillRect(0, 250, 256, 14); }
  if (kind === 'shirt') { g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 4; g.beginPath(); g.moveTo(128, 48); g.lineTo(128, 290); g.stroke();
    for (let y = 80; y < 290; y += 40) { g.fillStyle = '#fff'; g.beginPath(); g.arc(136, y, 4, 0, 7); g.fill(); } }
  if (kind === 'pant') { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(60, 14, 136, 16); }
  if (dirty) {
    g.fillStyle = 'rgba(70,60,40,.25)'; g.fillRect(0, 0, 256, 300);
    for (let i = 0; i < 9; i++) {
      const x = 40 + rnd() * 176, y = 40 + rnd() * 230, r = 10 + rnd() * 26;
      const m = g.createRadialGradient(x, y, 0, x, y, r); m.addColorStop(0, 'rgba(92,60,28,.85)'); m.addColorStop(1, 'rgba(92,60,28,0)');
      g.fillStyle = m; g.beginPath(); g.ellipse(x, y, r * 1.3, r, rnd() * 3, 0, 7); g.fill();
    }
  }
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 3; clothShape(g, kind); g.stroke();
  return canvasTex(c);
}
const CW = 1.0, CH = 1.17;
function makeCloth(def, dirty) {
  const geo = new THREE.PlaneGeometry(CW, CH, 16, 18);
  const base = Float32Array.from(geo.attributes.position.array);
  const mat = new THREE.MeshStandardMaterial({ map: clothTexture(def.kind, def.color, dirty), roughness: 0.9, alphaTest: 0.5, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  const grp = new THREE.Group(); grp.add(mesh); scene.add(grp);
  return { grp, mesh, geo, base, seed: rnd() * 6.28 };
}
// crumple (k=1) or hang-and-wave (k=0) the cloth. Hanging clothes are anchored at their top edge.
function shapeCloth(c, crumple, phase) {
  const p = c.geo.attributes.position, b = c.base;
  for (let i = 0; i < p.count; i++) {
    const x = b[i * 3], y = b[i * 3 + 1];
    const d = (CH / 2 - y) / CH; // 0 at top, 1 at bottom
    const wz = 0.16 * Math.pow(d, 1.2) * Math.sin(2.4 * x + phase + c.seed) + 0.03 * Math.sin(5 * y + phase * 2 + c.seed);
    const wx = 0.05 * d * Math.sin(phase + c.seed);
    const cz = 0.22 * Math.sin(x * 4 + c.seed) * Math.cos(y * 3.3 + c.seed);
    const cs = 1 - 0.35 * crumple * (0.5 + 0.5 * Math.sin(x * 3 + y * 2 + c.seed));
    p.setXYZ(i, (x + wx * (1 - crumple)) * cs, y * (1 - 0.25 * crumple), wz * (1 - crumple) + cz * crumple);

const dirty = CLOTH.map((d) => makeCloth(d, true));
const clean = CLOTH.map((d) => makeCloth(d, false));

// tumbling clothes seen through the glass

  const m = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 12), new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.9 }));
  m.scale.set(1.3, 0.8, 0.12); drum.add(m); return m;
});
const foam = [];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4, transparent: true, opacity: 0.9 }));
  const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 0.6;
  foam.push({ m, a, r, s: 0.05 + rnd() * 0.09 }); m.scale.set(1, 1, 0.3); drum.add(m);
}

// ---------- clothesline ----------
const LINE_HALF = P(3.4, 2.2), SAG = 0.22;
const lineGroup = new THREE.Group(); scene.add(lineGroup);
const ropeY = (x) => SAG * Math.pow(x / LINE_HALF, 2) - SAG;
{
  const pts = []; for (let i = 0; i <= 40; i++) { const x = -LINE_HALF + (2 * LINE_HALF * i) / 40; pts.push(new THREE.Vector3(x, ropeY(x), 0)); }
  lineGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.018, 8), new THREE.MeshStandardMaterial({ color: '#f2f2f2', roughness: 0.6 })));
  const wood = new THREE.MeshStandardMaterial({ color: '#9b6b3d', roughness: 0.7 });
  for (const s of [-1, 1]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 6, 16), wood);
    pole.position.set(s * LINE_HALF, -3 + 0.1, 0); lineGroup.add(pole);
  }
}
const SPOTS = P([-2.6, -1.3, 0, 1.3, 2.6], [-1.7, -0.85, 0, 0.85, 1.7]);

  for (const s of [-0.3, 0.3]) {
    const peg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.06), pegMat);
    peg.position.set(s, CH / 2 - 0.02, 0.03); c.grp.add(peg);
  }
});

// ---------- lights ----------
scene.add(new THREE.AmbientLight('#cfe3ff', 0.4));

const fill = new THREE.PointLight('#2a8bff', 12, 20); fill.position.set(-3, -2, 4); scene.add(fill);

// ---------- bubbles ----------
const bubbleTex = (() => { const [c, g] = mkCanvas(128, 128);
  const r = g.createRadialGradient(64, 64, 40, 64, 64, 62); r.addColorStop(0, 'rgba(255,255,255,0.02)'); r.addColorStop(0.8, 'rgba(180,235,255,0.25)'); r.addColorStop(1, 'rgba(255,255,255,0.75)');
  g.fillStyle = r; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.ellipse(44, 40, 14, 8, -0.7, 0, 7); g.fill();
  return canvasTex(c); })();
const bubbleMat = new THREE.SpriteMaterial({ map: bubbleTex, transparent: true, depthWrite: false, opacity: 0.8 });
const bubbles = [];
for (let i = 0; i < 34; i++) {
  const m = new THREE.Sprite(bubbleMat);
  bubbles.push({ m, x: (rnd() - .5) * 12, y: (rnd() - .5) * 8, z: -3.5 + rnd() * 3.0, r: 0.12 + rnd() * 0.45, sp: 0.5 + rnd(), ph: rnd() * 6 });
  scene.add(m);
}

// ---------- powder stream ----------
const N = 2200;

for (let i = 0; i < N; i++) {
  seeds.push({ e: rnd(), jx: rnd() - 0.5, jy: rnd() - 0.5, jz: rnd() - 0.5 });
  const c = rnd(); col.set(c < 0.6 ? [1, 1, 1] : c < 0.88 ? [0.45, 0.85, 1] : [0.2, 0.5, 1], i * 3);
}

pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const dot = (() => { const [c, g] = mkCanvas(64, 64);
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const pMat = new THREE.PointsMaterial({ size: 0.06, map: dot, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
const powder = new THREE.Points(pGeo, pMat); powder.frustumCulled = false; scene.add(powder);

// ---------- camera ----------
const camera = new THREE.PerspectiveCamera(P(35, 52), W / H, 0.1, 100);

// ---------- timeline helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));

  if (t <= full[0][0]) return { ...full[0][1] };
  for (let i = 0; i < full.length - 1; i++) {
    const [t0, a] = full[i], [t1, b] = full[i + 1];
    if (t <= t1) { const k = ease(seg(t, t0, t1)); const o = {}; for (const p in b) o[p] = lerp(a[p] ?? b[p], b[p], k); return o; }
  }

const apply = (obj, s) => { obj.position.set(s.x ?? 0, s.y ?? 0, s.z ?? 0); obj.rotation.set(s.rx ?? 0, s.ry ?? 0, s.rz ?? 0); obj.scale.setScalar(s.s ?? 1); };
const TAU = Math.PI * 2;
function bezier(a, c, b, k) { const u = 1 - k; return new THREE.Vector3(u * u * a.x + 2 * u * k * c.x + k * k * b.x, u * u * a.y + 2 * u * k * c.y + k * k * b.y, u * u * a.z + 2 * u * k * c.z + k * k * b.z); }

const MACHINE_Y = P(-0.45, 0.55), MACHINE_S = P(0.82, 0.92);
const LINE_Y = P(1.05, 1.9);
const tmp = new THREE.Vector3();

window.renderAt = (t) => {

    [0.00, { x: 0, y: -4.2, z: 0, rx: 0.5, ry: -2.67, rz: 0.25, s: 0.9 }],
    [0.10, { y: 0, rx: 0.05, ry: 0, rz: 0, s: 1 }],
    [0.20, { ry: TAU }],
    [0.28, { x: P(-2.9, -1.45), y: P(1.3, 3.0), ry: TAU + 0.3, rx: 0, s: P(0.45, 0.36) }],

    [0.62, { x: P(-2.9, -1.45), y: P(1.3, 3.0), z: 0, rz: 0, s: P(0.45, 0.36) }],
    [0.68, { y: 7 }],
    [0.885, {}],
    [0.905, { x: P(-1.55, 0), y: P(-5, 7), ry: TAU - 0.6 }],
    [0.96, { x: P(-1.55, 0), y: P(-0.25, 1.9), ry: TAU + P(0.35, -0.25), rz: 0, s: P(0.85, 0.62) }],
  ]);

  // ----- washing machine -----
  // on wide screens the machine steps aside for the caption (right, left, right)

  apply(machine, mk);
  machine.visible = mk.y > -6.9;

  machine.updateMatrixWorld(true);
  const doorWorld = drum.getWorldPosition(new THREE.Vector3());

  // drum contents
  const arrived = dirty.filter((_, i) => t > 0.30 + i * 0.024 + 0.08).length;
  const cleanLeft = clean.filter((_, i) => t < 0.685 + i * 0.01).length;
  const drumSpin = t * 6 + easeOut(wash) * 26;
  drumBlobs.forEach((m, i) => {
    m.visible = i < arrived && i < (t < 0.68 ? 5 : cleanLeft);
    const a = drumSpin + i * 1.9 + Math.sin(i * 3.7), r = [0.42, 0.18, 0.5, 0.3, 0.45][i];
    m.position.set(Math.cos(a) * r, Math.sin(a) * r - 0.12, 0.02 + i * 0.004); m.rotation.z = a * 1.3 + i;
    m.scale.set([1.4, 1.1, 1.2, 0.9, 1.5][i], [0.7, 0.9, 0.6, 0.8, 0.55][i], 0.12);
    // colours wash clean
    m.material.color.set(CLOTH[i].color).lerp(new THREE.Color('#6b5638'), 0.55 * (1 - seg(t, 0.6, 0.66)));
  });
  const foamAmt = seg(t, 0.5, 0.6) * (1 - seg(t, 0.66, 0.69));
  foam.forEach((f, i) => {
    const a = f.a + drumSpin * 0.8;
    f.m.position.set(Math.cos(a) * f.r, Math.sin(a) * f.r, 0.05);
    f.m.scale.set(f.s * foamAmt, f.s * foamAmt, 0.3 * f.s * foamAmt); f.m.visible = foamAmt > 0.01;
  });

  // ----- dirty clothes fly into the door -----
  dirty.forEach((c, i) => {
    const t0 = 0.30 + i * 0.024, k = seg(t, t0, t0 + 0.08);
    c.grp.visible = k > 0 && k < 1;
    if (!c.grp.visible) return;
    const side = i % 2 ? 1 : -1;
    const start = new THREE.Vector3(side * P(4.6, 3.0), P(1.2, 2.6) - i * 0.25, 2.2);
    const ctrl = new THREE.Vector3(side * P(2.4, 1.4), P(2.4, 3.6), 2.6);
    const kk = easeOut(k);
    c.grp.position.copy(bezier(start, ctrl, doorWorld.clone().add(tmp.set(0, 0, 0.3)), kk));
    c.grp.rotation.set(0.3 * Math.sin(k * 6 + i), 0.5 * Math.sin(k * 5 + i) * side, k * 4 * side + i * 0.5);
    c.grp.scale.setScalar(lerp(P(1.0, 0.8), 0.12, Math.pow(kk, 4)));
    shapeCloth(c, 0.35 + 0.65 * k, k * 10);
  });

  // ----- powder stream from the pouch into the open door -----
  const pour = seg(t, 0.5, 0.57);
  powder.visible = pour > 0 && pour < 1;
  if (powder.visible) {
    const top = new THREE.Vector3(0, POUCH_TOP, 0).applyEuler(packGroup.rotation).multiplyScalar(pk.s).add(packGroup.position);
    const target = doorWorld.clone().add(tmp.set(0.05, 0.05, 0.25));
    const p = powder.geometry.attributes.position, LIFE = 0.28;
    for (let i = 0; i < N; i++) {
      const sd = seeds[i], age = (pour - sd.e * (1 - LIFE)) / LIFE;
      if (age < 0 || age > 1) { p.setXYZ(i, 0, -50, 0); continue; }
      const spread = 0.03 + 0.18 * age;
      p.setXYZ(i,
        lerp(top.x, target.x, age) + sd.jx * spread,
        top.y + (target.y - top.y) * age * age + Math.sin(age * Math.PI) * 0.25 + sd.jy * spread,
        lerp(top.z, target.z, age) + sd.jz * spread);
    }
    p.needsUpdate = true;
    pMat.opacity = Math.min(1, pour * 8, (1 - pour) * 8);
  }

  // ----- clothesline + clean clothes -----
  const lk = track(t, [[0.66, { y: 7 }], [0.75, { y: LINE_Y }], [0.885, {}], [0.95, { y: 8 }]]);
  lk.z = -0.2; apply(lineGroup, lk);
  lineGroup.visible = t > 0.665 && t < 0.95;
  lineGroup.updateMatrixWorld(true);
  clean.forEach((c, i) => {
    const t0 = 0.685 + i * 0.01, k = seg(t, t0, t0 + 0.045);
    c.grp.visible = k > 0 && lineGroup.visible;
    if (!c.grp.visible) return;
    const sx = SPOTS[i];
    const anchor = new THREE.Vector3(sx, ropeY(sx) + 0.02, 0.05).applyMatrix4(lineGroup.matrixWorld);
    const hang = anchor.clone().add(tmp.set(0, -CH / 2 * CLOTH_SCALE, 0));
    const kk = easeOut(k);
    if (k < 1) {
      c.grp.position.copy(bezier(doorWorld.clone().add(tmp.set(0, 0, 0.3)), new THREE.Vector3(sx * 0.6, hang.y + 1.6, 1.2), hang, kk));
      c.grp.rotation.set(0, (1 - kk) * 3, (1 - kk) * 4 * (i % 2 ? 1 : -1));
      c.grp.scale.setScalar(lerp(0.12, CLOTH_SCALE, kk));
    } else {
      c.grp.position.copy(hang); c.grp.rotation.set(0, 0, 0); c.grp.scale.setScalar(CLOTH_SCALE);
    }
    shapeCloth(c, 1 - kk, phase);
  });

  // ----- cake -----
  const ck = track(t, [
    [0.886, { x: P(6, 0), y: P(-0.6, -7), z: 0.4, rx: 1.2, ry: -2.5, rz: 0.6, s: P(1, 0.95) }],
    [0.96, { x: P(1.75, 0), y: P(-0.6, -0.75), rx: 0.18, ry: -0.3, rz: -0.08 }],
  ]);
  apply(cakeGroup, ck);
  cakeGroup.visible = t > 0.886;

  // ----- bubbles (frozen inside the loop window, with a periodic bob) -----
  const bt = t < LOOP0 ? t : t < LOOP1 ? LOOP0 : t - (LOOP1 - LOOP0);
  const bo = seg(t, 0.06, 0.2);
  bubbles.forEach((q) => {
    const y = ((q.y + 4 + bt * 6 * q.sp) % 8) - 4;
    const bob = inLoop ? 0.12 * Math.sin(phase / WAVES + q.ph) : 0;
    q.m.position.set(q.x * P(1, 0.55) + Math.sin(bt * 8 + q.ph) * 0.2, y * P(1, 1.5) + bob, q.z);
    q.m.scale.setScalar(q.r * 2 * (0.3 + 0.7 * bo));
  });
  bubbleMat.opacity = 0.75 * bo;

  // ----- camera (still during the loop window) -----
  const cz = P(8.4, 9.4);
  const cam = track(t, [[0, { x: 0, y: 0.4, z: cz + 1 }], [0.2, { y: 0.2, z: cz - 0.6 }], [0.28, { y: 0.15, z: cz }], [0.885, {}], [1.0, { z: cz + 0.3 }]]);
  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(0, cam.y - 0.15, 0);

  renderer.render(scene, camera);
};
window.grab = (q) => renderer.domElement.toDataURL('image/webp', q);
window.ready = true;
</script></body></html>
